<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H-Style | E-Commerce Gabon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans pb-24">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-pink-600 flex items-center gap-2">
                <span>🌿</span> H-Style
            </h1>
            <div class="flex items-center gap-2">
                <!-- Bouton Admin sécurisé -->
                <button onclick="promptAdminAccess()" class="bg-pink-100 hover:bg-pink-200 text-pink-700 px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-1 transition">
                    <i class="fa-solid fa-lock text-xs"></i> ⚙️ Admin
                </button>
                
                <!-- Bouton Panier -->
                <button onclick="toggleCart()" class="relative bg-gray-100 hover:bg-gray-200 p-2 rounded-lg text-gray-700 transition">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-pink-600 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6">

        <!-- Panneau d'Administration (Masqué par défaut) -->
        <section id="admin-panel" class="bg-white p-5 rounded-xl shadow-md border border-pink-200 mb-8 hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-user-shield text-pink-600"></i> Administration H-Style
                </h2>
                <button onclick="closeAdminPanel()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <form id="add-product-form" onsubmit="handleProductSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Nom du produit</label>
                    <input type="text" id="p-name" required placeholder="ex: Robe Fleurie d'Été" class="w-full p-2.5 border rounded-lg text-sm focus:ring-pink-500 focus:border-pink-500">
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Catégorie</label>
                        <select id="p-category" required class="w-full p-2.5 border rounded-lg text-sm bg-white">
                            <option value="Vêtements">Vêtements</option>
                            <option value="Sacs">Sacs</option>
                            <option value="Chaussures">Chaussures</option>
                            <option value="Bijoux">Bijoux</option>
                            <option value="Beauté">Beauté</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Prix (FCFA)</label>
                        <input type="number" id="p-price" required placeholder="15000" class="w-full p-2.5 border rounded-lg text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">URL de l'image</label>
                    <input type="url" id="p-image" required placeholder="https://exemple.com/image.jpg" class="w-full p-2.5 border rounded-lg text-sm">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Tailles / Options (séparées par une virgule)</label>
                        <input type="text" id="p-sizes" placeholder="S, M, L, XL" class="w-full p-2.5 border rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Stock disponible</label>
                        <input type="number" id="p-stock" value="10" required class="w-full p-2.5 border rounded-lg text-sm">
                    </div>
                </div>

                <button type="submit" id="btn-save-product" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-semibold py-3 rounded-lg transition text-sm">
                    Enregistrer dans la Base de Données
                </button>
            </form>
        </section>

        <!-- Filtres par catégorie -->
        <section class="flex gap-2 overflow-x-auto pb-4 mb-4 scrollbar-hide">
            <button onclick="filterCategory('all')" class="bg-pink-600 text-white px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap shadow-sm">Tout</button>
            <button onclick="filterCategory('Vêtements')" class="bg-white text-gray-600 px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap shadow-sm border">Vêtements</button>
            <button onclick="filterCategory('Sacs')" class="bg-white text-gray-600 px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap shadow-sm border">Sacs</button>
            <button onclick="filterCategory('Chaussures')" class="bg-white text-gray-600 px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap shadow-sm border">Chaussures</button>
            <button onclick="filterCategory('Bijoux')" class="bg-white text-gray-600 px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap shadow-sm border">Bijoux</button>
        </section>

        <!-- Grille de produits -->
        <section id="products-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4">
            <div class="col-span-full text-center py-12 text-gray-400">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                <p class="text-sm">Chargement du catalogue...</p>
            </div>
        </section>

    </main>

    <!-- Modal du Panier / Commande -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 flex justify-end hidden">
        <div class="bg-white w-full max-w-md h-full p-6 flex flex-col justify-between overflow-y-auto">
            <div>
                <div class="flex justify-between items-center pb-4 border-b">
                    <h3 class="font-bold text-lg text-gray-800">Votre Panier</h3>
                    <button onclick="toggleCart()" class="text-gray-400 text-xl"><i class="fa-solid fa-xmark"></i></button>
                </div>
                
                <div id="cart-items" class="py-4 space-y-3">
                    <!-- Articles du panier dynamiques -->
                </div>
            </div>

            <div class="border-t pt-4 space-y-4">
                <div class="flex justify-between text-base font-bold text-gray-800">
                    <span>Total :</span>
                    <span id="cart-total">0 FCFA</span>
                </div>
                <button onclick="sendWhatsAppOrder()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 transition">
                    <i class="fa-brands fa-whatsapp text-xl"></i> Commander sur WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION SUPABASE (Collez vos clés ici) ---
        const SUPABASE_URL = 'https://votre-projet.supabase.co';
        const SUPABASE_ANON_KEY = 'votre-cle-anon-publique-ici';
        
        // Initialisation Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Mot de passe Administrateur
        const ADMIN_CODE = "Hstyle2026";
        
        let allProducts = [];
        let cart = [];

        // Accès Admin
        function promptAdminAccess() {
            const pwd = prompt("Entrez le mot de passe Administrateur H-Style :");
            if (pwd === ADMIN_CODE) {
                document.getElementById('admin-panel').classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else if (pwd !== null) {
                alert("Mot de passe incorrect.");
            }
        }

        function closeAdminPanel() {
            document.getElementById('admin-panel').classList.add('hidden');
        }

        // Charger les produits
        async function fetchProducts() {
            try {
                const { data, error } = await supabase.from('products').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                allProducts = data || [];
                renderProducts(allProducts);
            } catch (err) {
                console.error("Erreur de chargement:", err);
                document.getElementById('products-grid').innerHTML = `<p class="col-span-full text-center text-red-500 py-8">Impossible de charger les produits. Vérifiez vos clés Supabase.</p>`;
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('products-grid');
            if (products.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-400 py-10">Aucun produit disponible dans le catalogue.</p>`;
                return;
            }

            grid.innerHTML = products.map(p => `
                <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100 flex flex-col justify-between">
                    <img src="${p.image_url}" alt="${p.name}" class="w-full h-40 object-cover" onerror="this.src='https://via.placeholder.com/300?text=Pas+d+image'">
                    <div class="p-3 flex-1 flex flex-col justify-between">
                        <div>
                            <span class="text-[10px] bg-pink-50 text-pink-600 px-2 py-0.5 rounded-full font-medium">${p.category}</span>
                            <h3 class="font-semibold text-sm text-gray-800 mt-1 line-clamp-1">${p.name}</h3>
                            <p class="text-pink-600 font-bold text-sm mt-1">${Number(p.price).toLocaleString()} FCFA</p>
                        </div>
                        <button onclick="addToCart('${p.id}')" class="w-full mt-3 bg-gray-900 hover:bg-pink-600 text-white text-xs py-2 rounded-lg font-medium transition">
                            Ajouter au panier
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Enregistrer un produit
        async function handleProductSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-product');
            btn.innerText = "Enregistrement en cours...";
            btn.disabled = true;

            const name = document.getElementById('p-name').value;
            const category = document.getElementById('p-category').value;
            const price = parseFloat(document.getElementById('p-price').value);
            const image_url = document.getElementById('p-image').value;
            const sizes = document.getElementById('p-sizes').value.split(',').map(s => s.trim()).filter(Boolean);
            const stock = parseInt(document.getElementById('p-stock').value);

            const { error } = await supabase.from('products').insert([{ name, category, price, image_url, sizes, stock }]);

            btn.disabled = false;
            btn.innerText = "Enregistrer dans la Base de Données";

            if (error) {
                alert("Erreur lors de l'enregistrement : " + error.message);
            } else {
                alert("Produit ajouté avec succès !");
                document.getElementById('add-product-form').reset();
                closeAdminPanel();
                fetchProducts();
            }
        }

        // Gestion du Panier
        function addToCart(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (product) {
                cart.push(product);
                updateCartUI();
            }
        }

        function updateCartUI() {
            const count = document.getElementById('cart-count');
            count.innerText = cart.length;
            count.classList.toggle('hidden', cart.length === 0);

            const itemsContainer = document.getElementById('cart-items');
            itemsContainer.innerHTML = cart.map((item, idx) => `
                <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-lg text-sm">
                    <div>
                        <p class="font-medium text-gray-800">${item.name}</p>
                        <p class="text-xs text-pink-600 font-bold">${Number(item.price).toLocaleString()} FCFA</p>
                    </div>
                    <button onclick="removeFromCart(${idx})" class="text-red-400 hover:text-red-600 text-xs">Supprimer</button>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + Number(item.price), 0);
            document.getElementById('cart-total').innerText = `${total.toLocaleString()} FCFA`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
        }

        // WhatsApp Order
        function sendWhatsAppOrder() {
            if (cart.length === 0) {
                alert("Votre panier est vide.");
                return;
            }
            const phone = "24100000000"; // Modifiez avec votre numéro WhatsApp
            let text = "Bonjour H-Style, je souhaite passer la commande suivante :\n\n";
            cart.forEach((item, i) => {
                text += `${i + 1}. ${item.name} - ${Number(item.price).toLocaleString()} FCFA\n`;
            });
            const total = cart.reduce((sum, item) => sum + Number(item.price), 0);
            text += `\n*Total : ${total.toLocaleString()} FCFA*`;

            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
        }

        // Filtres
        function filterCategory(cat) {
            if (cat === 'all') {
                renderProducts(allProducts);
            } else {
                renderProducts(allProducts.filter(p => p.category === cat));
            }
        }

        // Lancement au chargement de la page
        document.addEventListener('DOMContentLoaded', fetchProducts);
    </script>
</body>
</html>
