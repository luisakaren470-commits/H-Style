<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H-Style 🌿 — La mode, selon ton style ♡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandPrimary: 'var(--primary-color, #ec4899)',
                        brandSecondary: 'var(--secondary-color, #f472b6)',
                        brandBg: 'var(--bg-color, #fff5f7)',
                    },
                    borderRadius: {
                        'custom': '1.5rem',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --primary-color: #ec4899;
            --secondary-color: #f472b6;
            --bg-color: #fff5f7;
            --text-color: #4a044e;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
        }
        .bg-custom-primary { background-color: var(--primary-color); }
        .text-custom-primary { color: var(--primary-color); }
    </style>
</head>
<body class="pb-24 md:pb-12">

    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-pink-100 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <h1 class="text-2xl font-bold tracking-wide text-custom-primary cursor-pointer" onclick="selectCategory('All')">
                H-Style 🌿
            </h1>
            
            <div class="flex-1 max-w-md hidden sm:block">
                <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Rechercher une robe, des talons..." class="w-full px-4 py-2 rounded-full border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-400 text-sm">
            </div>

            <div class="flex items-center gap-3">
                <button onclick="toggleAdminPanel()" class="text-xs bg-pink-100 hover:bg-pink-200 text-pink-800 font-semibold px-3 py-1.5 rounded-full transition">
                    ⚙️ Admin
                </button>
                <button onclick="toggleCart()" class="relative p-2 bg-pink-50 rounded-full hover:bg-pink-100">
                    🛍️ <span id="cartCount" class="absolute -top-1 -right-1 bg-custom-primary text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
        <div class="px-4 pb-3 sm:hidden">
            <input type="text" id="searchInputMobile" oninput="filterProductsMobile()" placeholder="Rechercher un article..." class="w-full px-4 py-2 rounded-full border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-400 text-sm">
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6">

        <section id="heroBanner" class="relative rounded-custom overflow-hidden mb-8 shadow-lg bg-gradient-to-r from-pink-400 to-purple-400 text-white p-8 md:p-12 text-center md:text-left flex flex-col items-center md:items-start justify-center min-h-[220px]">
            <h2 id="bannerTitleDisplay" class="text-3xl md:text-5xl font-extrabold mb-2 drop-shadow">La mode, selon ton style ♡</h2>
            <p id="bannerSubtitleDisplay" class="text-sm md:text-lg mb-6 opacity-90">Découvre la nouvelle collection féminine tendance au Gabon 🌸</p>
            <a href="#productsGrid" class="bg-white text-pink-600 font-bold px-6 py-3 rounded-full shadow-md hover:bg-pink-50 transition transform hover:-translate-y-0.5">
                Découvrir nos articles ✨
            </a>
        </section>

        <section class="mb-8">
            <h3 class="text-lg font-bold mb-4">Catégories</h3>
            <div class="flex gap-3 overflow-x-auto pb-2 scrollbar-none">
                <button onclick="selectCategory('All')" class="px-5 py-2 rounded-full bg-custom-primary text-white text-sm font-medium whitespace-nowrap shadow-sm">Toutes</button>
                <button onclick="selectCategory('Vêtements')" class="px-5 py-2 rounded-full bg-white text-gray-700 hover:bg-pink-50 text-sm font-medium whitespace-nowrap border border-pink-100 shadow-sm">👗 Vêtements</button>
                <button onclick="selectCategory('Chaussures')" class="px-5 py-2 rounded-full bg-white text-gray-700 hover:bg-pink-50 text-sm font-medium whitespace-nowrap border border-pink-100 shadow-sm">👠 Chaussures</button>
                <button onclick="selectCategory('Sacs')" class="px-5 py-2 rounded-full bg-white text-gray-700 hover:bg-pink-50 text-sm font-medium whitespace-nowrap border border-pink-100 shadow-sm">👜 Sacs</button>
                <button onclick="selectCategory('Bijoux')" class="px-5 py-2 rounded-full bg-white text-gray-700 hover:bg-pink-50 text-sm font-medium whitespace-nowrap border border-pink-100 shadow-sm">💎 Bijoux</button>
                <button onclick="selectCategory('Beauté')" class="px-5 py-2 rounded-full bg-white text-gray-700 hover:bg-pink-50 text-sm font-medium whitespace-nowrap border border-pink-100 shadow-sm">💄 Beauté</button>
            </div>
        </section>

        <section>
            <h3 class="text-lg font-bold mb-4">Nos Produits</h3>
            <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
                </div>
        </section>

        <div id="productModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end md:items-center justify-center p-0 md:p-4">
            <div class="bg-white w-full max-w-lg rounded-t-3xl md:rounded-custom overflow-hidden max-h-[90vh] overflow-y-auto p-6 space-y-4">
                <div class="flex justify-between items-start">
                    <h3 id="modalTitle" class="text-xl font-bold"></h3>
                    <button onclick="closeProductModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">✕</button>
                </div>
                <img id="modalImg" src="" class="w-full h-64 object-cover rounded-2xl">
                <div class="flex items-center gap-3">
                    <span id="modalPrice" class="text-2xl font-bold text-custom-primary"></span>
                    <span id="modalOldPrice" class="text-gray-400 line-through text-sm"></span>
                </div>
                <p id="modalDesc" class="text-gray-600 text-sm"></p>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Taille / Pointure / Option :</label>
                    <select id="modalOptionSelect" class="w-full p-2 border rounded-xl text-sm bg-gray-50"></select>
                </div>
                <button onclick="addCurrentToCart()" class="w-full py-3 bg-custom-primary text-white font-bold rounded-xl shadow-md hover:opacity-90">
                    Ajouter au Panier 🛍️
                </button>
            </div>
        </div>

        <div id="cartModal" class="fixed inset-0 bg-black/50 z-50 hidden flex justify-end">
            <div class="bg-white w-full max-w-md h-full p-6 flex flex-col justify-between overflow-y-auto">
                <div>
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold">Votre Panier 🛍️</h3>
                        <button onclick="toggleCart()" class="text-gray-400 font-bold text-xl">✕</button>
                    </div>
                    <div id="cartItems" class="space-y-4 mb-6"></div>
                </div>

                <div class="border-t pt-4 space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">Zone de livraison (Gabon) :</label>
                        <select id="deliveryZone" onchange="updateCartTotal()" class="w-full p-2 border rounded-xl text-sm bg-gray-50">
                            <option value="1500">Libreville — 1 500 FCFA</option>
                            <option value="2000">Akanda — 2 000 FCFA</option>
                            <option value="3000">Owendo — 3 000 FCFA</option>
                        </select>
                    </div>

                    <div class="flex justify-between text-sm"><span>Sous-total</span><span id="cartSubtotal" class="font-bold">0 FCFA</span></div>
                    <div class="flex justify-between text-sm"><span>Livraison</span><span id="cartDeliveryFee" class="font-bold">1 500 FCFA</span></div>
                    <div class="flex justify-between text-lg font-bold text-custom-primary border-t pt-2"><span>Total</span><span id="cartTotal">0 FCFA</span></div>

                    <div class="space-y-2 pt-2">
                        <input type="text" id="custName" placeholder="Nom & Prénom *" class="w-full p-2 border rounded-xl text-sm">
                        <input type="tel" id="custPhone" placeholder="Numéro de Téléphone *" class="w-full p-2 border rounded-xl text-sm">
                        <input type="text" id="custAddress" placeholder="Quartier / Repère de livraison *" class="w-full p-2 border rounded-xl text-sm">
                    </div>

                    <button onclick="sendOrderWhatsApp()" class="w-full py-3 bg-green-500 text-white font-bold rounded-xl shadow-md hover:bg-green-600 transition flex items-center justify-center gap-2">
                        <span>Commander sur WhatsApp</span> 💬
                    </button>
                </div>
            </div>
        </div>

        <div id="adminPanel" class="hidden bg-white p-6 rounded-custom border border-pink-100 shadow-md space-y-6 my-6">
            <div class="flex justify-between items-center border-b pb-4">
                <h3 class="text-xl font-bold text-gray-800">⚙️ Tableau de Bord Administration</h3>
                <button onclick="toggleAdminPanel()" class="text-xs bg-gray-200 px-3 py-1 rounded-full">Fermer</button>
            </div>

            <div class="space-y-4">
                <h4 class="font-bold text-sm text-gray-700">➕ Ajouter un Produit dans Supabase</h4>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <input type="text" id="newProdName" placeholder="Nom du produit" class="p-2 border rounded-xl text-sm">
                    <select id="newProdCategory" class="p-2 border rounded-xl text-sm">
                        <option value="Vêtements">Vêtements</option>
                        <option value="Chaussures">Chaussures</option>
                        <option value="Sacs">Sacs</option>
                        <option value="Bijoux">Bijoux</option>
                        <option value="Beauté">Beauté</option>
                    </select>
                    <input type="number" id="newProdPrice" placeholder="Prix (FCFA)" class="p-2 border rounded-xl text-sm">
                    <input type="text" id="newProdImg" placeholder="URL de l'image (Ex: https://...)" class="p-2 border rounded-xl text-sm">
                    <input type="text" id="newProdOptions" placeholder="Tailles/Pointures (ex: S, M, L)" class="p-2 border rounded-xl text-sm">
                    <input type="number" id="newProdStock" placeholder="Quantité en Stock" class="p-2 border rounded-xl text-sm">
                </div>
                <button onclick="addNewProduct()" class="w-full py-2 bg-custom-primary text-white font-bold rounded-xl shadow">Enregistrer dans la Base de Données</button>
            </div>
        </div>

    </main>

    <script>
        // 1. VOS ACCÈS SUPABASE
        const SUPABASE_URL = 'https://lwlzoznucxlwcakfabhd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3bHpvem51Y3hsd2Nha2ZhYmhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MjkwODMsImV4cCI6MjEwNDMwNTA4M30.sjZPIpJsAxMEdoujR6OFyuP_H2waT6jsxl71amtvfHU';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let products = [];
        let cart = [];
        let activeCategory = 'All';
        let selectedProduct = null;

        // Charger les produits au démarrage
        async function fetchProductsFromSupabase() {
            const { data, error } = await _supabase
                .from('products')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Erreur de chargement :", error.message);
            } else {
                products = data || [];
                renderProducts(products);
            }
        }

        // Afficher les produits
        function renderProducts(items = products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-400 py-8">Aucun produit disponible. Ajoute-en un depuis l'Admin ! ✨</p>`;
                return;
            }

            items.forEach(product => {
                const isPromo = product.old_price > product.price;
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-3 shadow-sm hover:shadow-md transition border border-pink-50 flex flex-col justify-between";
                
                card.innerHTML = `
                    <div>
                        <div class="relative mb-3">
                            <img src="${product.img || 'https://via.placeholder.com/300'}" class="w-full h-40 object-cover rounded-xl" alt="${product.name}">
                            ${isPromo ? `<span class="absolute top-2 left-2 bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">PROMO</span>` : ''}
                        </div>
                        <h4 class="font-bold text-sm text-gray-800 line-clamp-1">${product.name}</h4>
                        <p class="text-xs text-gray-400 mb-2">${product.category}</p>
                        <div class="flex items-center gap-2 mb-3">
                            <span class="font-bold text-pink-600 text-sm">${product.price.toLocaleString()} FCFA</span>
                            ${isPromo ? `<span class="text-gray-400 line-through text-xs">${product.old_price.toLocaleString()} FCFA</span>` : ''}
                        </div>
                    </div>
                    <button onclick="openProductModal(${product.id})" class="w-full py-2 bg-pink-50 text-pink-600 font-bold rounded-xl text-xs hover:bg-custom-primary hover:text-white transition">
                        Voir l'article ✨
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        // Ajouter un produit depuis l'admin
        async function addNewProduct() {
            const name = document.getElementById('newProdName').value;
            const category = document.getElementById('newProdCategory').value;
            const price = parseInt(document.getElementById('newProdPrice').value);
            const img = document.getElementById('newProdImg').value || "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=500";
            const options = document.getElementById('newProdOptions').value;
            const stock = parseInt(document.getElementById('newProdStock').value) || 1;

            if (!name || !price) {
                alert("Veuillez renseigner au moins le nom et le prix.");
                return;
            }

            const { data, error } = await _supabase
                .from('products')
                .insert([{ name, category, price, old_price: 0, img, options, stock }]);

            if (error) {
                alert("Erreur : " + error.message);
            } else {
                alert("Produit enregistré avec succès ! 🎉");
                document.getElementById('newProdName').value = '';
                document.getElementById('newProdPrice').value = '';
                fetchProductsFromSupabase();
            }
        }

        // Commander sur WhatsApp + enregistrement BDD
        async function sendOrderWhatsApp() {
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;
            const zoneSelect = document.getElementById('deliveryZone');
            const zoneText = zoneSelect.options[zoneSelect.selectedIndex].text;
            const deliveryFee = parseInt(zoneSelect.value);

            if (!name || !phone || !address || cart.length === 0) {
                alert("Veuillez remplir vos informations et ajouter au moins un produit.");
                return;
            }

            let subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            let total = subtotal + deliveryFee;

            await _supabase.from('orders').insert([{ 
                customer_name: name, customer_phone: phone, delivery_zone: zoneText, 
                delivery_address: address, total_amount: total, status: 'En attente'
            }]);

            let summary = `🌸 *NOUVELLE COMMANDE H-STYLE*\n\n👤 *Client :* ${name}\n📞 *Téléphone :* ${phone}\n📍 *Livraison :* ${address} (${zoneText})\n\n*Articles :*\n`;
            cart.forEach(item => {
                summary += `- ${item.name} (${item.option}) x${item.qty} : ${(item.price * item.qty).toLocaleString()} FCFA\n`;
            });
            summary += `\n💰 *Total à payer : ${total.toLocaleString()} FCFA*`;

            window.open(`https://wa.me/24100000000?text=${encodeURIComponent(summary)}`, '_blank');
        }

        // Fonctions Utilitaires
        function selectCategory(cat) {
            activeCategory = cat;
            renderProducts(cat === 'All' ? products : products.filter(p => p.category === cat));
        }

        function filterProducts() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderProducts(products.filter(p => p.name.toLowerCase().includes(q)));
        }

        function filterProductsMobile() {
            const q = document.getElementById('searchInputMobile').value.toLowerCase();
            renderProducts(products.filter(p => p.name.toLowerCase().includes(q)));
        }

        function openProductModal(id) {
            selectedProduct = products.find(p => p.id === id);
            document.getElementById('modalTitle').innerText = selectedProduct.name;
            document.getElementById('modalImg').src = selectedProduct.img || 'https://via.placeholder.com/300';
            document.getElementById('modalPrice').innerText = selectedProduct.price.toLocaleString() + " FCFA";
            document.getElementById('modalDesc').innerText = `Stock disponible : ${selectedProduct.stock} pièce(s)`;

            const select = document.getElementById('modalOptionSelect');
            select.innerHTML = '';
            const opts = selectedProduct.options ? selectedProduct.options.split(',') : ['Taille unique'];
            opts.forEach(opt => select.innerHTML += `<option value="${opt.trim()}">${opt.trim()}</option>`);

            document.getElementById('productModal').classList.remove('hidden');
        }

        function closeProductModal() { document.getElementById('productModal').classList.add('hidden'); }

        function addCurrentToCart() {
            const opt = document.getElementById('modalOptionSelect').value;
            const existing = cart.find(item => item.id === selectedProduct.id && item.option === opt);
            if (existing) { existing.qty++; } else { cart.push({ ...selectedProduct, option: opt, qty: 1 }); }
            updateCartUI(); closeProductModal(); toggleCart();
        }

        function toggleCart() { docume
